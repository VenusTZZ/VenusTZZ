<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" fill="none">
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    .ink { fill: #35362f; }
    .muted { fill: #8d918a; }
    .moon { fill: #e6d9bc; stroke: #bfae8c; stroke-width: 1.5; }
    .bird { stroke: #5f675f; }
    .star { fill: #8f9b8d; }
    .hill1 { fill: #c9d5c7; }
    .hill2 { fill: #a9bba7; }
    .hill3 { fill: #8aa189; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e8e6e0; }
      .muted { fill: #8e938b; }
      .moon { fill: #e9e6de; stroke: #b8b3a4; }
      .bird { stroke: #9aa396; }
      .star { fill: #55625a; }
      .hill1 { fill: #232c26; }
      .hill2 { fill: #2e3a30; }
      .hill3 { fill: #3b4a3b; }
    }
    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.82; }
    }
    .moon { animation: breathe 8s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .moon { animation: none; }
    }
  </style>

  <circle class="moon" cx="742" cy="88" r="50" />

  <circle class="star" cx="560" cy="52" r="1.6" />
  <circle class="star" cx="628" cy="34" r="1.2" />
  <circle class="star" cx="806" cy="42" r="1.4" />
  <circle class="star" cx="852" cy="96" r="1.2" />
  <circle class="star" cx="500" cy="96" r="1.1" />

  <path class="bird" stroke-width="1.6" stroke-linecap="round" d="M585 84 q7 -7 14 0 q7 -7 14 0" />
  <path class="bird" stroke-width="1.6" stroke-linecap="round" d="M626 62 q5.5 -5.5 11 0 q5.5 -5.5 11 0" />

  <text x="0" y="120" class="ink" font-size="52" font-weight="300" letter-spacing="14">Venus</text>

  <path class="hill1" d="M0 208 C 140 178, 250 214, 400 196 C 540 180, 690 162, 900 198 L 900 280 L 0 280 Z" />
  <path class="hill2" d="M0 236 C 170 206, 300 250, 470 230 C 620 214, 760 206, 900 238 L 900 280 L 0 280 Z" />
  <path class="hill3" d="M0 262 C 190 244, 380 274, 560 256 C 720 244, 820 252, 900 264 L 900 280 L 0 280 Z" />
</svg>
