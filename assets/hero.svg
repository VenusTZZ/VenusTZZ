  </style>
  <text x="0" y="76" class="ink" font-size="44" font-weight="300" letter-spacing="12">Venus</text>
  <text x="0" y="110" class="muted" font-size="12" letter-spacing="2.5">AI · Frontend · Backend</text>
  <line x1="250" y1="64" x2="872" y2="64" class="rule" stroke-width="1" />
  <circle cx="884" cy="64" r="3.5" class="dot" />
